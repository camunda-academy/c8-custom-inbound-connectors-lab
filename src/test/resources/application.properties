camunda.client.mode=saas
camunda.client.cloud.cluster-id=***
camunda.client.cloud.cluster-region=***
camunda.client.auth.client-id=***
camunda.client.auth.client-secret=***
camunda.client.grpc-address=https://***.***.zeebe.camunda.io:443
camunda.client.rest-address=https://***.zeebe.camunda.io/***

# Configure secret provider prefix for security
camunda.connectors.secretprovider.environment.enabled=false
camunda.connectors.secretprovider.environment.prefix=CONNECTOR_SECRET_
